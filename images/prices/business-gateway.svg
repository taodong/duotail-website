<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
  <rect width="500" height="400" fill="#112141"/>

  <text x="250" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="2.5" font-weight="700" fill="#00a99d">YOUR OWN DOMAIN &amp; CLOUD</text>

  <!-- building icon (from org.svg), recolored for dark background -->
  <g transform="translate(178,52) scale(0.42)">
    <rect x="112" y="102.52" width="32" height="116.71" fill="none" stroke="#ffffff" stroke-width="10"/>
    <rect x="47.76" y="102.52" width="32" height="116.71" fill="none" stroke="#ffffff" stroke-width="10"/>
    <rect x="176.24" y="102.52" width="32" height="116.71" fill="none" stroke="#ffffff" stroke-width="10"/>
    <rect x="25.41" y="219.23" width="205.18" height="20.75" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="128 16.02 25.41 102.52 230.59 102.52 128 16.02" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="128" cy="65.45" r="16" fill="none" stroke="#00a99d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- domain pill -->
  <rect x="115" y="182" width="270" height="38" rx="19" fill="none" stroke="#00a99d" stroke-width="3"/>
  <text x="250" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5fd1c6">you@yourdomain.com</text>

  <!-- feature chips -->
  <rect x="35" y="238" width="140" height="34" rx="17" fill="none" stroke="#2c3d63" stroke-width="3"/>
  <text x="105" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Unlimited Groups</text>

  <rect x="185" y="238" width="130" height="34" rx="17" fill="none" stroke="#2c3d63" stroke-width="3"/>
  <text x="250" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Legacy Inboxes</text>

  <rect x="325" y="238" width="140" height="34" rx="17" fill="none" stroke="#2c3d63" stroke-width="3"/>
  <text x="395" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Admin Console</text>

  <!-- CTA banner -->
  <rect x="90" y="308" width="320" height="56" rx="28" fill="#f4623a"/>
  <text x="250" y="337" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Contact Us</text>
  <text x="250" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffe4dc">for a custom quote</text>
</svg>
